[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "urop-depression-research"
version = "0.1.0"
description = "Local, provenance-aware DAIC-WOZ research workflows"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
urop = "urop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
ignore_missing_imports = true
